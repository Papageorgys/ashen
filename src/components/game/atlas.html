<title>Ashen Realm — War Table (prototype)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --ground: #211b12;
    --ground-2: #2b2417;
    --panel: #2a2216;
    --panel-edge: #6a5227;
    --ink: #efe3c8;
    --ink-soft: #b9a67e;
    --ink-dim: #8a774f;
    --gold: #e2b24a;
    --gold-soft: #d8b969;
    --parch: #e7d7b3;
    --sea: #6b7f92;
    --danger: #c0492f;
    --grade-c: #86c08a;
    --frame: #7a5f2f;
    --shadow: rgba(0, 0, 0, 0.55);
    --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(120% 90% at 50% -10%, #2f2716 0%, var(--ground) 55%, #191309 100%);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .app { display: flex; flex-direction: column; height: 100dvh; }

  header.masthead {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 12px 18px 10px;
    border-bottom: 1px solid #4a3a1e;
    background: linear-gradient(180deg, #2c2415, #221b11);
  }
  header.masthead h1 {
    margin: 0; font-family: var(--serif); font-weight: 600;
    letter-spacing: 0.16em; text-transform: uppercase;
    font-size: clamp(15px, 2.4vw, 20px);
    color: var(--gold);
    text-shadow: 0 1px 0 #000;
  }
  header.masthead .sub { color: var(--ink-dim); font-size: 12px; letter-spacing: 0.02em; }
  header.masthead .spacer { flex: 1; }
  header.masthead .hint { color: var(--ink-dim); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; }

  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }

  /* the parchment viewport (clips the pannable layers) */
  .viewport {
    position: absolute; inset: 0;
    cursor: grab;
    background-color: #6a929a;
    background-image:
      radial-gradient(150% 130% at 45% 25%, #7ea6ac 0%, #5f858d 55%, #47707a 100%);
  }
  .viewport.dragging { cursor: grabbing; }
  .layers { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: 0 0; will-change: transform; }
  .layers canvas, .layers svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .layers canvas { image-rendering: auto; }
  .layers svg { pointer-events: none; overflow: visible; }
  .tok { pointer-events: auto; cursor: pointer; }

  /* vignette + foxing over everything */
  .grain { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 100% at 50% 45%, transparent 55%, rgba(20,14,6,0.5) 100%);
    mix-blend-mode: multiply; }

  /* floating chrome */
  .modes {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 2px; padding: 3px;
    background: rgba(28,22,12,0.86); border: 1px solid var(--panel-edge); border-radius: 4px;
    box-shadow: 0 10px 26px -12px var(--shadow); backdrop-filter: blur(6px); z-index: 5;
  }
  .modes button {
    appearance: none; border: 0; background: transparent; color: var(--ink-soft);
    font-family: var(--sans); font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase;
    padding: 6px 11px; border-radius: 3px; cursor: pointer; transition: background .15s, color .15s;
  }
  .modes button:hover { color: var(--ink); }
  .modes button[aria-pressed="true"] { background: rgba(226,178,74,0.16); color: var(--gold); box-shadow: inset 0 0 0 1px rgba(226,178,74,0.4); }

  .zoombar { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
  .zoombar button {
    width: 34px; height: 34px; border-radius: 4px; cursor: pointer;
    background: rgba(28,22,12,0.86); border: 1px solid var(--panel-edge); color: var(--ink);
    font-size: 17px; font-family: var(--serif); line-height: 1; backdrop-filter: blur(6px);
    box-shadow: 0 8px 20px -12px var(--shadow);
  }
  .zoombar button:hover { border-color: var(--gold); color: var(--gold); }
  .zoombar button.reset { font-size: 11px; letter-spacing: .04em; }

  .legend {
    position: absolute; left: 12px; bottom: 12px; z-index: 5;
    background: rgba(28,22,12,0.86); border: 1px solid var(--panel-edge); border-radius: 4px;
    padding: 9px 11px; backdrop-filter: blur(6px); box-shadow: 0 8px 20px -12px var(--shadow);
    max-width: 210px;
  }
  .legend h4 { margin: 0 0 6px; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-soft); font-weight: 600; }
  .legend .row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-soft); padding: 2px 0; }
  .legend .sw { width: 13px; height: 13px; border-radius: 2px; border: 1px solid rgba(0,0,0,.4); flex: none; }

  /* compass */
  .compass { position: absolute; right: 14px; top: 12px; width: 62px; height: 62px; z-index: 4; opacity: .85; filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); pointer-events: none; }

  /* hover tooltip */
  .tip {
    position: absolute; z-index: 8; pointer-events: none; opacity: 0; transform: translateY(4px);
    transition: opacity .12s; min-width: 150px; max-width: 240px;
    background: linear-gradient(180deg, #2d2415, #241c10); color: var(--ink);
    border: 1px solid var(--panel-edge); border-radius: 5px; padding: 8px 10px;
    box-shadow: 0 14px 30px -12px var(--shadow);
  }
  .tip.on { opacity: 1; transform: translateY(0); }
  .tip .t-name { font-family: var(--serif); font-size: 13px; color: var(--gold); letter-spacing: .02em; }
  .tip .t-kind { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-dim); margin-top: 1px; }
  .tip .t-row { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; margin-top: 5px; color: var(--ink-soft); }
  .tip .t-row b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }

  /* briefing drawer */
  .brief {
    position: absolute; top: 0; right: 0; height: 100%; width: min(310px, 82vw); z-index: 6;
    background: linear-gradient(180deg, #2b2315, #211a0f);
    border-left: 1px solid var(--panel-edge); box-shadow: -18px 0 40px -24px #000;
    transform: translateX(100%); transition: transform .28s cubic-bezier(.22,.61,.36,1);
    display: flex; flex-direction: column; padding: 16px 16px 18px; gap: 12px; overflow-y: auto;
  }
  .brief.open { transform: translateX(0); }
  .brief .close { position: absolute; top: 10px; right: 12px; background: none; border: 0; color: var(--ink-dim); font-size: 18px; cursor: pointer; }
  .brief .close:hover { color: var(--ink); }
  .brief .eyebrow { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); }
  .brief h2 { margin: 0; font-family: var(--serif); font-size: 22px; color: var(--gold); letter-spacing: .01em; text-wrap: balance; line-height: 1.05; }
  .brief .blurb { font-size: 12.5px; color: var(--ink-soft); font-style: italic; line-height: 1.5; margin: -2px 0 2px; }
  .brief .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: rgba(255,255,255,0.03); border: 1px solid #4a3a1e; border-radius: 4px; padding: 8px 9px; }
  .stat .k { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
  .stat .v { font-size: 16px; font-family: var(--serif); color: var(--ink); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat .v.small { font-size: 13px; }
  .meter { height: 6px; border-radius: 3px; background: #3a2f19; overflow: hidden; margin-top: 6px; }
  .meter > i { display: block; height: 100%; }
  .drops { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-size: 10.5px; border: 1px solid #4a3a1e; border-radius: 3px; padding: 3px 7px; color: var(--ink-soft); background: rgba(0,0,0,.15); }
  .chip.rare { color: #8fb7d8; border-color: #37506a; }
  .chip.epic { color: #c69bd8; border-color: #573a6a; }
  .brief .section-t { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-soft); font-weight: 600; margin-bottom: -4px; }
  .brief .send { margin-top: 4px; appearance: none; border: 1px solid var(--gold); background: rgba(226,178,74,0.12); color: var(--gold);
    font-family: var(--serif); letter-spacing: .04em; font-size: 14px; padding: 9px; border-radius: 4px; cursor: pointer; }
  .brief .send:hover { background: rgba(226,178,74,0.22); }
  .brief .note { font-size: 10.5px; color: var(--ink-dim); line-height: 1.5; }

  @media (max-width: 620px) {
    .legend { display: none; }
    .modes button { padding: 6px 8px; font-size: 10px; }
  }
</style>

<div class="app">
  <header class="masthead">
    <h1>The Ashen Realm</h1>
    <span class="sub">War Table · atlas prototype</span>
    <span class="spacer"></span>
    <span class="hint">drag to pan · scroll to zoom · hover a land · click to brief</span>
  </header>

  <div class="stage">
    <div class="viewport" id="viewport">
      <div class="layers" id="layers">
        <canvas id="provinces"></canvas>
        <svg id="overlay" viewBox="0 0 100 62" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
    </div>
    <div class="grain"></div>

    <div class="modes" id="modes" role="group" aria-label="Map mode">
      <button data-mode="terrain" aria-pressed="true">Terrain</button>
      <button data-mode="banners" aria-pressed="false">Banners</button>
      <button data-mode="threat" aria-pressed="false">Threat</button>
      <button data-mode="surge" aria-pressed="false">Surge</button>
      <button data-mode="realms" aria-pressed="false">Realms</button>
    </div>

    <svg class="compass" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="#d8b969" stroke-width="1.5" opacity="0.7"/>
      <circle cx="50" cy="50" r="40" fill="none" stroke="#d8b969" stroke-width="0.6" opacity="0.5"/>
      <polygon points="50,6 56,50 50,44 44,50" fill="#c0492f"/>
      <polygon points="50,94 44,50 50,56 56,50" fill="#e7d7b3"/>
      <polygon points="6,50 50,44 44,50 50,56" fill="#8a774f"/>
      <polygon points="94,50 50,56 56,50 50,44" fill="#8a774f"/>
      <text x="50" y="17" fill="#efe3c8" font-size="9" text-anchor="middle" font-family="Georgia, serif">N</text>
    </svg>

    <div class="zoombar">
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">&minus;</button>
      <button id="zreset" class="reset" title="Reset view">Fit</button>
    </div>

    <div class="legend" id="legend"><h4>Legend</h4><div id="legend-body"></div></div>

    <div class="tip" id="tip"></div>

    <aside class="brief" id="brief" aria-live="polite">
      <button class="close" id="brief-close" aria-label="Close briefing">&times;</button>
      <div id="brief-body"></div>
    </aside>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---- Realm data (from the game's ZONES / ZONE_POS / LANDMARKS) --------------
  const ZONES = [
    ["wolf_fields","Greywolf Fields","field",1,30,24,66,"Starving packs roam the wheat ruins."],
    ["ruined_orchard","Ruined Orchard","field",12,120,38,78,"Blighted trees, restless scarecrows, easy experience."],
    ["ashen_steppe","Ashen Steppe","field",24,320,58,62,"Open burnt plains crawling with ash beasts."],
    ["frost_hollow","Frost Hollow","field",36,640,74,26,"A wide frozen basin. Cold, endless, profitable."],
    ["wyrm_plateau","Wyrm Plateau","field",46,1000,88,52,"High wind-scoured stone under circling wyrms."],
    ["millpond_reeds","Millpond Reeds","field",5,55,19,74,"Leech-thick shallows and croaking things."],
    ["briar_downs","Briar Downs","field",9,90,31,88,"Thorn hills where the boar-riders range."],
    ["kingsroad_marches","Kingsroad Marches","field",17,190,44,58,"Bandits work the old imperial road."],
    ["saltmere_flats","Saltmere Flats","field",20,250,52,74,"Cracked salt pans and carrion birds."],
    ["emberwood","Emberwood","field",29,400,63,54,"A forest that never stopped smouldering."],
    ["moonveil_glade","Moonveil Glade","field",32,500,40,30,"Fae-lit woods, beautiful and hostile."],
    ["stormbreak_coast","Stormbreak Coast","field",41,800,74,62,"Wreck-strewn cliffs under permanent storm."],
    ["cinderwaste","The Cinderwaste","field",49,1250,84,34,"Nothing lives here that isn't burning."],
    ["sunken_crypt","Sunken Crypt","dungeon",15,200,16,40,"Flooded halls of a drowned house."],
    ["howling_warren","Howling Warren","dungeon",8,90,30,56,"Beast-dug tunnels beneath the downs."],
    ["drowned_chapel","Drowned Chapel","dungeon",21,300,13,64,"Bells still toll under the black water."],
    ["ashen_quarry","Ashen Quarry","dungeon",27,460,47,44,"Slave-cut pit gone to something worse."],
    ["obsidian_labyrinth","Obsidian Labyrinth","dungeon",33,600,55,32,"Glass corridors that rearrange themselves."],
    ["abyss_gate","Gate of the Abyss","dungeon",40,900,66,84,"A door that should have stayed shut."],
    ["frozen_hold","The Frozen Hold","dungeon",44,1050,82,14,"A fortress swallowed whole by the ice."],
    ["wyrm_roost","Wyrm Roost","dungeon",50,1500,90,16,"The eldest wyrms nest in the high crags."],
    ["sunless_throne","The Sunless Throne","dungeon",52,1900,78,70,"Where the last dead king still holds court."],
    ["verdant_hollow","Verdant Hollow","field",7,70,22,34,"Mossy dells the deer still keep."],
    ["thornmarsh","Thornmarsh","field",13,140,26,80,"Reed and rot where the river meets the sea."],
    ["emberpass","Emberpass","dungeon",47,1150,90,40,"The only road through the wall of peaks."],
    ["talking_isle","Talking Isle","field",3,35,11,88,"A green rock offshore where new blades muster."],
    ["gull_reef","Gull Reef","dungeon",18,240,8,80,"Wreckers and drowned things haunt the shoals."],
    ["north_reach","The North Reach","field",34,560,50,7,"Wind-scoured moor at the realm's northern edge."],
    ["greywatch","Greywatch Ruins","dungeon",30,520,66,9,"A fallen border keep, now a monster nest."],
    ["ironwood","Ironwood","field",26,380,30,10,"Old-growth timber the loggers learned to fear."],
    ["duskfen","Duskfen","field",22,300,14,26,"Coastal fen loud with frogs and worse."],
    ["highmarch","Highmarch Hold","dungeon",42,980,86,58,"A ruined castle on the southern crag."],
    ["sablecoast","Sable Coast","field",24,340,36,84,"Black-sand strand along the gulf."],
    ["lakenvel","Lakenvel","field",18,220,58,44,"Fisher-camps ringing the still lake."],
    ["stag_moor","Stag Moor","field",15,180,72,52,"Heather hills and antlered herds."],
  ].map(function (z) {
    return { id: z[0], name: z[1], kind: z[2], lvl: z[3], threat: z[4], x: z[5], y: z[6], blurb: z[7] };
  });

  const LAND = [
    ["havenreach","Havenreach","town",30,52],
    ["greymarket","Greymarket","town",52,30],
    ["emberwatch","Emberwatch","town",68,68],
    ["coldspire","Coldspire","town",82,36],
    ["ravensgate","Ravensgate","castle",42,18],
    ["ravenhold","Ravenhold","castle",60,90],
  ].map(function (l) { return { id: l[0], name: l[1], kind: l[2], x: l[3], y: l[4] }; });

  const ROADS = [[30,52,42,18],[30,52,52,30],[52,30,68,68],[52,30,82,36],[30,52,38,78],[68,68,88,52]];
  const HOME = { x: 35, y: 46 };
  // Open sea (south-west gulf + coast) and inland lakes — map coords (100 x 62).
  const SEA_PATH = "M0 36 C 8 40, 14 44, 13 50 C 12 56, 26 55, 30 60 C 34 63, 44 63, 46 63 L 0 63 Z";
  const LAKES = [ { x: 55, y: 26, rx: 6, ry: 4 }, { x: 38, y: 22, rx: 3.2, ry: 2.4 }, { x: 72, y: 34, rx: 3.4, ry: 2.6 } ];
  const ISLES = [ [10, 54.6, 4.2, 3.2], [7, 49.6, 3.0, 2.4] ];

  // The five named reaches, anchored on towns/keeps.
  const REACH = {
    havenreach: { name: "Havenreach", color: [96, 128, 92] },
    greymarket: { name: "Greymarket", color: [96, 118, 150] },
    emberwatch: { name: "Emberwatch", color: [186, 120, 70] },
    coldspire: { name: "Coldspire", color: [110, 160, 168] },
    ravenhold: { name: "Ravenhold", color: [150, 96, 130] },
  };
  const REACH_IDS = Object.keys(REACH);
  const anchors = LAND.filter(function (l) { return REACH_IDS.indexOf(l.id) >= 0; });
  function regionOf(z) {
    let best = null, bd = Infinity;
    anchors.forEach(function (a) {
      const d = Math.hypot(a.x - z.x, a.y - z.y);
      if (d < bd) { bd = d; best = a.id; }
    });
    return best;
  }
  ZONES.forEach(function (z) { z.region = regionOf(z); });

  // The seven realms — six races plus the fallen human empire at the heart.
  // Each has a ruined capital; a zone belongs to the nearest capital, so the
  // borders fall along the mountains and the sea.
  const REALMS = {
    sylvani:   { race: "Sylvani",   capital: "Eldanar",     x: 28, y: 16, color: [92, 138, 92] },
    ravenfold: { race: "Ravenfold", capital: "Ravensgate",  x: 48, y: 16, color: [154, 124, 98] },
    durgan:    { race: "Durgan",    capital: "Kaz Durom",   x: 80, y: 20, color: [120, 120, 152] },
    hyunan:    { race: "Hyunan",    capital: "Cael Havar",  x: 44, y: 46, color: [184, 164, 92] },
    kaemari:   { race: "Kaemari",   capital: "Aeraveth",    x: 84, y: 50, color: [108, 160, 168] },
    grakhar:   { race: "Grakhar",   capital: "Gor Ashkul",  x: 68, y: 74, color: [190, 110, 72] },
    nocturi:   { race: "Nocturi",   capital: "Vael Noctis", x: 22, y: 62, color: [156, 100, 146] },
  };
  const REALM_IDS = Object.keys(REALMS);
  function realmOf(z) {
    let best = null, bd = Infinity;
    REALM_IDS.forEach(function (id) {
      const r = REALMS[id], d = Math.hypot(r.x - z.x, r.y - z.y);
      if (d < bd) { bd = d; best = id; }
    });
    return best;
  }
  ZONES.forEach(function (z) { z.realm = realmOf(z); });

  // Deterministic "today's surges" (3 zones) — evokes the surge system.
  const SURGE = { moonveil_glade: 1, ashen_steppe: 1, frozen_hold: 1 };

  // Sample host + banners so the war-room reads like a live realm.
  const HOST_POWER = 5200;
  const banners = [
    { name: "Duskmoor's Own", crest: "#6b1d1d", state: "farm", zone: "ashen_steppe" },
    { name: "The Iron Vigil", crest: "#1d3a6b", state: "march", zone: "frost_hollow", t: 0.34 },
    { name: "Ashwake Lancers", crest: "#1d5b3a", state: "boss" },
  ];
  const BOSS_ZONE = "sunless_throne";

  // ---- rarity/loot flavour by tier (for the briefing) ------------------------
  function dropsFor(lvl) {
    if (lvl >= 45) return [["Abyss Crystal","epic"],["Dragon Sinew","epic"],["Ember Core","rare"]];
    if (lvl >= 30) return [["Ember Core","rare"],["Moon Silk","rare"],["Spirit Ore",""]];
    if (lvl >= 15) return [["Spirit Ore",""],["Moon Silk","rare"],["Bone Dust",""]];
    return [["Coarse Hide",""],["Iron Shard",""],["Bone Dust",""]];
  }
  function travelSec(z) { return Math.max(3, Math.round(Math.hypot(z.x - HOME.x, z.y - HOME.y) * 0.42)); }
  function deathRisk(z) {
    let base = z.kind === "dungeon" ? 0.14 : 0.05;
    base += z.lvl >= 45 ? 0.06 : z.lvl >= 30 ? 0.03 : 0;
    return base;
  }
  function odds(z) { return Math.round(Math.max(8, Math.min(96, 15 + (HOST_POWER / z.threat) * 60))); }

  // ---- Canvas province engine ------------------------------------------------
  const S = 10, MW = 100, MH = 62, W = MW * S, H = MH * S; // 1000 x 620
  const cv = document.getElementById("provinces");
  cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const img = ctx.createImageData(W, H);
  const buf = img.data;

  // land mask via the coastline
  const mask = document.createElement("canvas"); mask.width = W; mask.height = H;
  const mctx = mask.getContext("2d");
  mctx.setTransform(S, 0, 0, S, 0, 0);
  mctx.fillStyle = "#fff"; mctx.fillRect(0, 0, MW, MH);   // the continent fills the whole frame
  mctx.globalCompositeOperation = "destination-out";
  mctx.fill(new Path2D(SEA_PATH));                          // carve the south-west sea gulf + coast
  mctx.globalCompositeOperation = "source-over";
  mctx.fillStyle = "#fff";
  ISLES.forEach(function (o) { mctx.beginPath(); mctx.ellipse(o[0], o[1], o[2], o[3], 0, 0, Math.PI * 2); mctx.fill(); }); // offshore isles
  mctx.setTransform(1, 0, 0, 1, 0, 0);
  const landAlpha = mctx.getImageData(0, 0, W, H).data;

  // nearest-zone index per land pixel (Voronoi) + border mask — computed once
  const idx = new Int16Array(W * H).fill(-1);
  const border = new Uint8Array(W * H);
  const zpx = ZONES.map(function (z) { return { x: z.x * S, y: z.y * 0.62 * S }; });
  for (let py = 0; py < H; py++) {
    for (let px = 0; px < W; px++) {
      const i = py * W + px;
      if (landAlpha[i * 4 + 3] < 40) continue; // sea
      let bi = -1, bd = Infinity;
      for (let k = 0; k < zpx.length; k++) {
        const dx = zpx[k].x - px, dy = zpx[k].y - py, d = dx * dx + dy * dy;
        if (d < bd) { bd = d; bi = k; }
      }
      idx[i] = bi;
    }
  }
  for (let py = 0; py < H; py++) {
    for (let px = 0; px < W; px++) {
      const i = py * W + px, me = idx[i];

      for (let i=0;i<n;i++){ gStatic.appendChild(mtn(r.x + (i-(n-1)/2)*2.7, my(r.y) + (i%2?0.8:0), 0.55*r.h + 0.5)); }
    });
    TREES.forEach(function (t) { if (!onWater(t[0], my(t[1]))) gStatic.appendChild(forest(t[0], my(t[1]))); });
    // teleport routes: a faint ink trail under a cyan dashed line
    ROADS.forEach(function (r) {
      gStatic.appendChild(el("path", { d:"M"+r[0]+" "+my(r[1])+" L"+r[2]+" "+my(r[3]), fill:"none", stroke:"#3a2c18", "stroke-width":0.5, opacity:0.16 }));
      gStatic.appendChild(el("path", { d:"M"+r[0]+" "+my(r[1])+" L"+r[2]+" "+my(r[3]), fill:"none", stroke:"#33c6d6", "stroke-width":0.42, "stroke-linecap":"round", "stroke-dasharray":"0.05 1.2", opacity:0.95 }));
    });
    // zone points of interest
    ZONES.forEach(function (z) { if (z.id !== BOSS_ZONE && !onWater(z.x, my(z.y))) gStatic.appendChild(zoneIcon(z)); });
    // towns & castles with pins + labels
    LAND.forEach(function (l) {
      gStatic.appendChild(l.kind === "castle" ? tower(l.x, my(l.y)) : town(l.x, my(l.y)));
      if (l.kind === "town") gStatic.appendChild(pin(l.x, my(l.y) + 0.2));
      const t = el("text", { x:l.x, y:my(l.y) + 2.5, "text-anchor":"middle", "font-family":"Georgia, serif",
        "font-size":2.0, fill:"#fbf1dd", "font-weight":"600", "paint-order":"stroke", stroke:"#3a2810", "stroke-width":0.65 });
      t.textContent = l.name; gStatic.appendChild(t);
    });
    // the World Boss — a beast skull with a pin
    const bz = ZONES.find(function (z) { return z.id === BOSS_ZONE; });
    if (bz) { gStatic.appendChild(pin(bz.x, my(bz.y))); const t = el("text", { x:bz.x, y:my(bz.y)-2.7, "text-anchor":"middle", "font-size":3.2, fill:"#b83a22" }); t.textContent="☠"; gStatic.appendChild(t); }
    // province names in an italic hand
    ZONES.forEach(function (z) {
      const t = el("text", { x:z.x, y:my(z.y) + 2.2, "text-anchor":"middle", "font-family":"Georgia, serif",
        "font-size":1.7, fill:"#3a2c14", opacity:0.78, "letter-spacing":0.15, "font-style":"italic",
        "paint-order":"stroke", stroke:"#ece0c2", "stroke-width":0.4, "stroke-opacity":0.6 });
      t.textContent = z.name; gStatic.appendChild(t);
    });
    gStatic.appendChild(town(HOME.x, my(HOME.y)));
    // the seven fallen capitals, with the realm name spread across each territory
    REALM_IDS.forEach(function (id) {
      const r = REALMS[id], cx = r.x, cy = my(r.y);
      const rn = el("text", { x:cx, y:cy - 4.8, "text-anchor":"middle", "font-family":"Georgia, serif",
        "font-size":3.4, fill:"rgb("+r.color[0]+","+r.color[1]+","+r.color[2]+")", opacity:0.42,
        "letter-spacing":0.7, "font-weight":"700" });
      rn.textContent = r.race.toUpperCase(); gStatic.appendChild(rn);
      gStatic.appendChild(capitalRuin(cx, cy));
      const t = el("text", { x:cx, y:cy + 3.1, "text-anchor":"middle", "font-family":"Georgia, serif",
        "font-size":2.0, fill:"#5c1f13", "font-weight":"600", "paint-order":"stroke", stroke:"#efe0c2", "stroke-width":0.55 });
      t.textContent = r.capital + " †"; gStatic.appendChild(t);
    });
  }

  function updateTokens() {
    while (gDyn.firstChild) gDyn.removeChild(gDyn.firstChild);
    banners.forEach(function (b) {
      if (b.state === "boss") return;
      const z = ZONES.find(function (x) { return x.id === b.zone; });
      if (!z) return;
      let bx = z.x, by = my(z.y);
      if (b.state === "march") {
        bx = HOME.x + (z.x - HOME.x) * b.t; by = my(HOME.y + (z.y - HOME.y) * b.t);
        gDyn.appendChild(el("line", { x1: HOME.x, y1: my(HOME.y), x2: z.x, y2: my(z.y),
          stroke: "#d8b969", "stroke-width": 0.4, "stroke-dasharray": "1.4 1", opacity: 0.7 }));
      }
      const g = el("g", {});
      g.appendChild(el("line", { x1: bx, y1: by, x2: bx, y2: by - 3.4, stroke: "#2a2010", "stroke-width": 0.4 }));
      g.appendChild(el("path", { d: "M" + bx + " " + (by - 3.4) + " l 3 0.7 l -3 0.9 z", fill: b.crest, stroke: "#1a1206", "stroke-width": 0.25 }));
      g.appendChild(el("circle", { cx: bx, cy: by, r: 0.5, fill: "#1a1206" }));
      gDyn.appendChild(g);
    });
  }
  buildStatic(); updateTokens();

  // ---- pan / zoom ------------------------------------------------------------
  const viewport = document.getElementById("viewport");
  const layers = document.getElementById("layers");
  let zoom = 1, panX = 0, panY = 0;
  const MINZ = 1, MAXZ = 9;
  function applyT() { layers.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + zoom + ")"; }
  function clampPan() {
    const r = viewport.getBoundingClientRect();
    const w = r.width * zoom, h = r.height * zoom;
    const minX = Math.min(0, r.width - w), minY = Math.min(0, r.height - h);
    panX = Math.max(minX, Math.min(0, panX));
    panY = Math.max(minY, Math.min(0, panY));
    void h;
  }
  function zoomAt(cx, cy, nz) {
    const r = viewport.getBoundingClientRect();
    const lx = (cx - r.left - panX) / zoom, ly = (cy - r.top - panY) / zoom;
    zoom = Math.max(MINZ, Math.min(MAXZ, nz));
    panX = cx - r.left - lx * zoom; panY = cy - r.top - ly * zoom;
    clampPan(); applyT();
  }
  viewport.addEventListener("wheel", function (e) {
    e.preventDefault();
    zoomAt(e.clientX, e.clientY, zoom * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
  }, { passive: false });
  document.getElementById("zin").onclick = function () { const r = viewport.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, zoom * 1.3); };
  document.getElementById("zout").onclick = function () { const r = viewport.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, zoom / 1.3); };
  document.getElementById("zreset").onclick = function () { zoom = 1; panX = 0; panY = 0; applyT(); };

  let dragging = false, moved = false, sx = 0, sy = 0, spx = 0, spy = 0;
  viewport.addEventListener("pointerdown", function (e) {
    dragging = true; moved = false; sx = e.clientX; sy = e.clientY; spx = panX; spy = panY;
    viewport.classList.add("dragging"); viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener("pointermove", function (e) {
    if (dragging) {
      panX = spx + (e.clientX - sx); panY = spy + (e.clientY - sy);
      if (Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) > 3) moved = true;
      clampPan(); applyT();
    }
    updateHover(e.clientX, e.clientY);
  });
  viewport.addEventListener("pointerup", function (e) {
    dragging = false; viewport.classList.remove("dragging");
    if (!moved) {
      const k = zoneAt(e.clientX, e.clientY);
      if (k >= 0) selectZone(k); else closeBrief();
    }
  });
  viewport.addEventListener("pointerleave", function () { hideTip(); if (hover !== -1) { hover = -1; scheduleRender(); } });

  // screen -> zone index
  function zoneAt(cx, cy) {
    const r = viewport.getBoundingClientRect();
    const mx = ((cx - r.left - panX) / zoom) / r.width * MW;
    const myy = ((cy - r.top - panY) / zoom) / r.height * MH;
    if (mx < 0 || mx > MW || myy < 0 || myy > MH) return -1;
    const px = Math.floor(mx * S), py = Math.floor(myy * S);
    if (px < 0 || px >= W || py < 0 || py >= H) return -1;
    return idx[py * W + px];
  }

  // ---- hover tooltip ---------------------------------------------------------
  const tip = document.getElementById("tip");
  let rafPending = false;
  function scheduleRender() { if (!rafPending) { rafPending = true; requestAnimationFrame(function () { rafPending = false; render(); }); } }
  function hideTip() { tip.classList.remove("on"); }
  function updateHover(cx, cy) {
    const k = zoneAt(cx, cy);
    if (k !== hover) { hover = k; scheduleRender(); }
    if (k < 0) { hideTip(); return; }
    const z = ZONES[k];
    tip.innerHTML =
      '<div class="t-name">' + z.name + '</div>' +
      '<div class="t-kind">' + (z.kind === "dungeon" ? "Dungeon" : "Open field") + " · " + REACH[z.region].name + " reach</div>" +
      '<div class="t-row"><span>Recommended</span><b>Lv ' + z.lvl + "</b></div>" +
      '<div class="t-row"><span>Threat</span><b>' + z.threat + "</b></div>" +
      '<div class="t-row"><span>Your odds</span><b>' + odds(z) + "%</b></div>";
    const st = document.querySelector(".stage").getBoundingClientRect();
    let tx = cx - st.left + 14, ty = cy - st.top + 14;
    if (tx > st.width - 250) tx = cx - st.left - 250;
    if (ty > st.height - 120) ty = cy - st.top - 120;
    tip.style.left = tx + "px"; tip.style.top = ty + "px";
    tip.classList.add("on");
  }

  // ---- briefing drawer -------------------------------------------------------
  const brief = document.getElementById("brief");
  const briefBody = document.getElementById("brief-body");
  document.getElementById("brief-close").onclick = closeBrief;
  function closeBrief() { brief.classList.remove("open"); if (selected !== -1) { selected = -1; scheduleRender(); } }
  function selectZone(k) {
    selected = k; scheduleRender();
    const z = ZONES[k];
    const o = odds(z), risk = Math.round(deathRisk(z) * 100), tv = travelSec(z);
    const oddsColor = o >= 66 ? "#86c08a" : o >= 40 ? "#e2b24a" : "#c0492f";
    const drops = dropsFor(z.lvl).map(function (d) {
      return '<span class="chip ' + d[1] + '">' + d[0] + "</span>";
    }).join("");
    briefBody.innerHTML =
      '<div class="eyebrow">' + (z.kind === "dungeon" ? "Dungeon" : "Open field") + " · " + REACH[z.region].name + " reach</div>" +
      "<h2>" + z.name + "</h2>" +
      '<p class="blurb">' + z.blurb + "</p>" +
      '<div class="grid">' +
        '<div class="stat"><div class="k">Recommended</div><div class="v">Lv ' + z.lvl + "</div></div>" +
        '<div class="stat"><div class="k">Threat</div><div class="v">' + z.threat + "</div></div>" +
        '<div class="stat"><div class="k">Your odds</div><div class="v" style="color:' + oddsColor + '">' + o + "%</div>" +
          '<div class="meter"><i style="width:' + o + "%;background:" + oddsColor + '"></i></div></div>' +
        '<div class="stat"><div class="k">Death risk</div><div class="v small">' + risk + "%</div>" +
          '<div class="meter"><i style="width:' + Math.min(100, risk * 4) + '%;background:#c0492f"></i></div></div>' +
        '<div class="stat"><div class="k">March from keep</div><div class="v small">~' + tv + "s</div></div>" +
        '<div class="stat"><div class="k">Surge</div><div class="v small" style="color:' + (SURGE[z.id] ? "#e2b24a" : "#8a774f") + '">' + (SURGE[z.id] ? "Active" : "—") + "</div></div>" +
      "</div>" +
      '<div class="section-t">The hoard</div>' +
      '<div class="drops">' + drops + "</div>" +
      '<button class="send">Send a banner →</button>' +
      '<p class="note">Prototype briefing — numbers are live from the game’s zone table (level, threat, reaches, march distance). Odds assume a ~5,200-power host.</p>';
    brief.classList.add("open");
  }

  // ---- legend ----------------------------------------------------------------
  const legendBody = document.getElementById("legend-body");
  function renderLegend() {
    let rows = "";
    function sw(c) { return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }
    if (mode === "realms") {
      REALM_IDS.forEach(function (id) { rows += '<div class="row"><span class="sw" style="background:' + sw(REALMS[id].color) + '"></span>' + REALMS[id].race + "</div>"; });
    } else if (mode === "threat") {
      rows += '<div class="row"><span class="sw" style="background:rgb(120,150,96)"></span>Calm</div>';
      rows += '<div class="row"><span class="sw" style="background:rgb(214,178,74)"></span>Perilous</div>';
      rows += '<div class="row"><span class="sw" style="background:rgb(192,73,47)"></span>Deadly</div>';
    } else if (mode === "surge") {
      rows += '<div class="row"><span class="sw" style="background:rgb(226,178,74)"></span>Surge active (bonus XP &amp; rep)</div>';
    } else if (mode === "banners") {
      rows += '<div class="row"><span class="sw" style="background:rgb(226,178,74)"></span>Your banner farms here</div>';
      rows += '<div class="row"><span class="sw" style="background:rgb(176,132,58)"></span>Marching to</div>';
      rows += '<div class="row"><span class="sw" style="background:rgb(192,73,47)"></span>World Boss</div>';
    } else {
      [[[128,158,155],"Sea"],[[172,172,133],"Lowland"],[[200,187,146],"Steppe"],
       [[190,171,137],"Highland"],[[171,153,124],"Peak"],[[224,218,203],"Snow"]].forEach(function (r) {
        rows += '<div class="row"><span class="sw" style="background:' + sw(r[0]) + '"></span>' + r[1] + "</div>";
      });
    }
    legendBody.innerHTML = rows;
  }

  // ---- map modes -------------------------------------------------------------
  document.getElementById("modes").addEventListener("click", function (e) {
    const b = e.target.closest("button"); if (!b) return;
    mode = b.dataset.mode;
    Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) {
      x.setAttribute("aria-pressed", x === b ? "true" : "false");
    });
    renderLegend(); render();
  });

  // ---- marching animation ----------------------------------------------------
  const marchers = banners.filter(function (b) { return b.state === "march"; });
  let last = 0;
  function loop(t) {
    if (!last) last = t;
    const dt = (t - last) / 1000; last = t;
    let changed = false;
    marchers.forEach(function (b) { b.t += dt * 0.03; if (b.t > 1) b.t = 0; changed = true; });
    if (changed) updateTokens();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---- boot ------------------------------------------------------------------
  render(); renderLegend(); applyT();
})();
</script>
